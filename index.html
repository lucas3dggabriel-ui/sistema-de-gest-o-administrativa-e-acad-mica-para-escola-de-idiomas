<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Escola de Idiomas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎓 Sistema de Gestão - Escola de Idiomas</h1>

    <div class="card">
        <h3>Cadastrar Aluno</h3>

        <form id="formAluno">

            <div class="row">

                <div class="col-md-4">
                    <input type="text"
                           class="form-control"
                           id="nome"
                           placeholder="Nome do aluno"
                           required>
                </div>

                <div class="col-md-4">
                    <input type="text"
                           class="form-control"
                           id="curso"
                           placeholder="Curso"
                           required>
                </div>

                <div class="col-md-2">
                    <input type="number"
                           class="form-control"
                           id="nota"
                           placeholder="Nota"
                           step="0.1"
                           required>
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">
                        Salvar
                    </button>
                </div>

            </div>

        </form>

    </div>

    <div class="card">

        <h3>Alunos Matriculados</h3>

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Curso</th>
                    <th>Nota</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaAlunos">

            </tbody>

        </table>

    </div>

</div>

<script>

carregarAlunos();

document.getElementById("formAluno")
.addEventListener("submit", async (e)=>{

    e.preventDefault();

    const aluno={
        nome:document.getElementById("nome").value,
        curso:document.getElementById("curso").value,
        nota:parseFloat(document.getElementById("nota").value)
    };

    await fetch("/api/alunos",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(aluno)
    });

    document.getElementById("formAluno").reset();

    carregarAlunos();

});

async function carregarAlunos(){

    const resposta =
        await fetch("/api/alunos");

    const alunos =
        await resposta.json();

    const tabela =
        document.getElementById("tabelaAlunos");

    tabela.innerHTML="";

    alunos.forEach(aluno=>{

        tabela.innerHTML += `
            <tr>

                <td>${aluno.id}</td>

                <td>${aluno.nome}</td>

                <td>${aluno.curso}</td>

                <td>${aluno.nota}</td>

                <td>

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="excluirAluno(${aluno.id})">

                        Excluir

                    </button>

                </td>

            </tr>
        `;
    });

}

async function excluirAluno(id){

    if(confirm("Deseja excluir este aluno?")){

        await fetch(`/api/alunos/${id}`,{
            method:"DELETE"
        });

        carregarAlunos();
    }

}

</script>

</body>
</html>
